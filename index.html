<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>NAS-Fortführungsauftrag für Baulast</title>
</head>
<body style="font-family:Verdana,sans-serif">
<h2>NAS-Fortführungsauftrag für Baulast generieren</h2>
<form action="nas-export.php" method="post" accept-charset="UTF-8">
<label for="antrag">Antragsnummer BP:</label>
<input type="text" size="20" id="antrag" name="antrag" required> &nbsp;
<label for="name">Art der Baulast:</label>
<input type="text" size="33" id="name" name="name" required><br><br>
<label for="ubab">Bauaufsicht:</label>
<select id="ubab" name="ubab" required>
	<option value="">auswählen</option>
	<option value="3333">Stelle 3333</option>
	<option value="4444">Stelle 4444</option>
</select>  &nbsp; 
<label for="bez">Baulastnr.*:</label>
<input type="text" size="20" id="bez" name="bez"> &nbsp; 
<label for="date">Eintragung*:</label>
<input type="date" id="date" name="date"><br><br>
<label for="umring">Umringskoordinaten:</label><br>
<textarea id="umring" name="umring" rows="20" cols="100" required></textarea>
<br><br><input type="submit" value="Download NAS"> &nbsp; 
<input type="reset" value="Zurücksetzen"></form>
*: <small>optionale Angaben</small>
</body>
</html>
